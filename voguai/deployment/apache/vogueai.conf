# VogueAI Apache Configuration
# Main configuration for the complete VogueAI fashion platform

# Enable required modules
# LoadModule rewrite_module modules/mod_rewrite.so
# LoadModule proxy_module modules/mod_proxy.so
# LoadModule proxy_http_module modules/mod_proxy_http.so
# LoadModule proxy_balancer_module modules/mod_proxy_balancer.so
# LoadModule lbmethod_byrequests_module modules/mod_lbmethod_byrequests.so
# LoadModule headers_module modules/mod_headers.so
# LoadModule deflate_module modules/mod_deflate.so
# LoadModule expires_module modules/mod_expires.so

<VirtualHost *:80>
    ServerName vogueai.local
    ServerAlias www.vogueai.local
    ServerAdmin admin@vogueai.local
    DocumentRoot "/path/to/voguai/frontend"
    
    # Directory configuration
    <Directory "/path/to/voguai/frontend">
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    
    # Security headers
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "no-referrer-when-downgrade"
    
    # Compression
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/plain
        AddOutputFilterByType DEFLATE text/html
        AddOutputFilterByType DEFLATE text/xml
        AddOutputFilterByType DEFLATE text/css
        AddOutputFilterByType DEFLATE application/xml
        AddOutputFilterByType DEFLATE application/xhtml+xml
        AddOutputFilterByType DEFLATE application/rss+xml
        AddOutputFilterByType DEFLATE application/javascript
        AddOutputFilterByType DEFLATE application/x-javascript
    </IfModule>
    
    # Expires headers
    <IfModule mod_expires.c>
        ExpiresActive On
        ExpiresByType text/css "access plus 1 year"
        ExpiresByType application/javascript "access plus 1 year"
        ExpiresByType image/png "access plus 1 year"
        ExpiresByType image/jpg "access plus 1 year"
        ExpiresByType image/jpeg "access plus 1 year"
        ExpiresByType image/gif "access plus 1 year"
        ExpiresByType image/ico "access plus 1 year"
        ExpiresByType image/svg+xml "access plus 1 year"
        ExpiresByType text/html "access plus 1 hour"
    </IfModule>
    
    # Flask application proxy
    <Proxy "balancer://flask_cluster">
        BalancerMember http://127.0.0.1:5000
        ProxySet lbmethod=byrequests
    </Proxy>
    
    ProxyPass /flask/ "balancer://flask_cluster/"
    ProxyPassReverse /flask/ "balancer://flask_cluster/"
    
    # FastAPI ML service proxy
    <Proxy "balancer://fastapi_cluster">
        BalancerMember http://127.0.0.1:8000
        ProxySet lbmethod=byrequests
    </Proxy>
    
    ProxyPass /api/ "balancer://fastapi_cluster/"
    ProxyPassReverse /api/ "balancer://fastapi_cluster/"
    
    # FastAPI docs
    ProxyPass /docs "balancer://fastapi_cluster/docs"
    ProxyPassReverse /docs "balancer://fastapi_cluster/docs"
    ProxyPass /redoc "balancer://fastapi_cluster/redoc"
    ProxyPassReverse /redoc "balancer://fastapi_cluster/redoc"
    
    # Django application proxy
    <Proxy "balancer://django_cluster">
        BalancerMember http://127.0.0.1:9000
        ProxySet lbmethod=byrequests
    </Proxy>
    
    ProxyPass /blog/ "balancer://django_cluster/"
    ProxyPassReverse /blog/ "balancer://django_cluster/"
    ProxyPass /admin/ "balancer://django_cluster/admin/"
    ProxyPassReverse /admin/ "balancer://django_cluster/admin/"
    
    # Django API
    ProxyPass /api/blog/ "balancer://django_cluster/api/blog/"
    ProxyPassReverse /api/blog/ "balancer://django_cluster/api/blog/"
    
    # Static files for Django
    Alias /static/django/ "/path/to/voguai/django_project/staticfiles/"
    <Directory "/path/to/voguai/django_project/staticfiles">
        Options Indexes FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>
    
    # Media files for Django
    Alias /media/ "/path/to/voguai/django_project/media/"
    <Directory "/path/to/voguai/django_project/media">
        Options Indexes FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>
    
    # Custom log files
    ErrorLog "/var/log/apache2/vogueai_error.log"
    CustomLog "/var/log/apache2/vogueai_access.log" combined
    
    # Health check
    <Location "/health">
        SetHandler server-status
        Require all granted
    </Location>
</VirtualHost>

# HTTPS configuration for production
<VirtualHost *:443>
    ServerName vogueai.local
    ServerAlias www.vogueai.local
    ServerAdmin admin@vogueai.local
    DocumentRoot "/path/to/voguai/frontend"
    
    # SSL Configuration
    SSLEngine on
    SSLCertificateFile "/path/to/ssl/vogueai.crt"
    SSLCertificateKeyFile "/path/to/ssl/vogueai.key"
    SSLCertificateChainFile "/path/to/ssl/vogueai_chain.crt"
    
    # SSL Protocol and Cipher Configuration
    SSLProtocol all -SSLv2 -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384
    SSLHonorCipherOrder on
    SSLCompression off
    SSLSessionTickets off
    
    # HSTS
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    
    # Directory configuration
    <Directory "/path/to/voguai/frontend">
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    
    # Include all the same proxy and static configurations as HTTP
    # (Same proxy configurations as above)
    
    # Custom log files for HTTPS
    ErrorLog "/var/log/apache2/vogueai_ssl_error.log"
    CustomLog "/var/log/apache2/vogueai_ssl_access.log" combined
</VirtualHost>

# Redirect HTTP to HTTPS
<VirtualHost *:80>
    ServerName vogueai.local
    ServerAlias www.vogueai.local
    Redirect permanent / https://vogueai.local/
</VirtualHost>
