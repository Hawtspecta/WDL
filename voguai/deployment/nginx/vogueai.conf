# VogueAI Nginx Configuration
# Main configuration for the complete VogueAI fashion platform

# Upstream servers for different applications
upstream flask_app {
    server 127.0.0.1:5000;
    keepalive 32;
}

upstream fastapi_app {
    server 127.0.0.1:8000;
    keepalive 32;
}

upstream django_app {
    server 127.0.0.1:9000;
    keepalive 32;
}

# Rate limiting
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=login:10m rate=1r/s;

# Main server block
server {
    listen 80;
    server_name vogueai.local www.vogueai.local;
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;
    
    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private must-revalidate auth;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/xml+rss
        application/json;
    
    # Static files for frontend
    location /static/ {
        alias /path/to/voguai/frontend/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        
        # Security for static files
        location ~* \.(?:ico|css|js|gif|jpe?g|png)$ {
            expires 1y;
            add_header Cache-Control "public";
        }
    }
    
    # Media files for Django
    location /media/ {
        alias /path/to/voguai/django_project/media/;
        expires 1y;
        add_header Cache-Control "public";
    }
    
    # Django static files
    location /static/django/ {
        alias /path/to/voguai/django_project/staticfiles/;
        expires 1y;
        add_header Cache-Control "public";
    }
    
    # Main frontend site
    location / {
        root /path/to/voguai/frontend;
        index index.html;
        try_files $uri $uri/ =404;
        
        # Cache HTML files
        location ~* \.html$ {
            expires 1h;
            add_header Cache-Control "public, must-revalidate";
        }
    }
    
    # Flask application
    location /flask/ {
        proxy_pass http://flask_app/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        
        # Buffer settings
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
    }
    
    # FastAPI ML service
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        
        proxy_pass http://fastapi_app/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts for ML processing
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Handle large requests for ML
        client_max_body_size 10M;
        proxy_request_buffering off;
    }
    
    # FastAPI docs and redoc
    location ~ ^/(docs|redoc|openapi\.json)$ {
        proxy_pass http://fastapi_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # Django blog application
    location /blog/ {
        proxy_pass http://django_app/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
    
    # Django admin
    location /admin/ {
        limit_req zone=login burst=5 nodelay;
        
        proxy_pass http://django_app/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Security for admin
        proxy_set_header X-Forwarded-SSL on;
    }
    
    # Django API endpoints
    location /api/blog/ {
        proxy_pass http://django_app/api/blog/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # API specific settings
        proxy_buffering off;
        proxy_cache off;
    }
    
    # Health check endpoints
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
    
    # Security: Block access to sensitive files
    location ~ /\. {
        deny all;
    }
    
    location ~ \.(env|log|conf)$ {
        deny all;
    }
    
    # Custom error pages
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
    
    location = /404.html {
        root /path/to/voguai/frontend;
        internal;
    }
    
    location = /50x.html {
        root /path/to/voguai/frontend;
        internal;
    }
}

# HTTPS configuration (for production)
server {
    listen 443 ssl http2;
    server_name vogueai.local www.vogueai.local;
    
    # SSL certificates (replace with your certificates)
    ssl_certificate /path/to/ssl/vogueai.crt;
    ssl_certificate_key /path/to/ssl/vogueai.key;
    
    # SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # HSTS
    add_header Strict-Transport-Security "max-age=31536000" always;
    
    # Redirect HTTP to HTTPS
    if ($scheme != "https") {
        return 301 https://$host$request_uri;
    }
    
    # Include all the same location blocks as HTTP server
    include /etc/nginx/conf.d/vogueai_locations.conf;
}

# HTTP to HTTPS redirect
server {
    listen 80;
    server_name vogueai.local www.vogueai.local;
    return 301 https://$server_name$request_uri;
}
