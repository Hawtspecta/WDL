{% extends 'blog/base.html' %}

{% block title %}Logged Out - VogueAI Blog{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header">
                    <h3 class="text-center">Logged Out</h3>
                </div>
                <div class="card-body text-center">
                    <div class="mb-4">
                        <i class="bi bi-check-circle text-success" style="font-size: 3rem;"></i>
                    </div>
                    <h4>You have been successfully logged out.</h4>
                    <p class="text-muted">Thank you for using VogueAI Blog!</p>
                    
                    <div class="mt-4">
                        <a href="{% url 'login' %}" class="btn btn-primary me-2">Login Again</a>
                        <a href="/blog/" class="btn btn-outline-secondary">Back to Blog</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
